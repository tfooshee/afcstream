name: Build and deploy Anchor Faith Streaming

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Monday and Thursday at 12:00 PM Eastern
    - cron: "0 16 * * 1,4"
    - cron: "0 17 * * 1,4"

    # Tuesday at 6:31 PM Eastern
    - cron: "31 22 * * 2"
    - cron: "31 23 * * 2"

permissions:
  contents: write
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Validate media cache and package site
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.refresh_gate.outputs.should_run }}
      should_refresh: ${{ steps.refresh_gate.outputs.should_refresh }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Determine workflow path
        id: refresh_gate
        shell: bash
        run: |
          set -euo pipefail

          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "should_refresh=true" >> "$GITHUB_OUTPUT"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            echo "should_refresh=false" >> "$GITHUB_OUTPUT"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          EASTERN_DAY="$(TZ=America/New_York date +%u)"
          EASTERN_TIME="$(TZ=America/New_York date +%H:%M)"
          EASTERN_SLOT="${EASTERN_DAY}:${EASTERN_TIME}"

          if [[ "${EASTERN_SLOT}" == "1:12:00" ]] || \
             [[ "${EASTERN_SLOT}" == "2:18:31" ]] || \
             [[ "${EASTERN_SLOT}" == "4:12:00" ]]; then
            echo "should_refresh=true" >> "$GITHUB_OUTPUT"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_refresh=false" >> "$GITHUB_OUTPUT"
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping alternate DST schedule trigger at Eastern slot ${EASTERN_SLOT}."
          fi

      - name: Setup Node
        if: steps.refresh_gate.outputs.should_run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install media refresh dependencies
        if: steps.refresh_gate.outputs.should_refresh == 'true'
        run: npm install --no-audit --no-fund

      - name: Generate real media cache
        if: steps.refresh_gate.outputs.should_refresh == 'true'
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        run: npm run generate:cache

      - name: Validate deployable media cache
        if: steps.refresh_gate.outputs.should_run == 'true'
        env:
          CACHE_LABEL: ${{ steps.refresh_gate.outputs.should_refresh == 'true' && 'Generated' || 'Committed' }}
        run: npm run validate:cache

      - name: Commit validated media cache to main
        if: steps.refresh_gate.outputs.should_refresh == 'true'
        env:
          SOURCE_SHA: ${{ steps.refresh_gate.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail

          CACHE_STAGE="$(mktemp -d)"
          cp media-cache.json media-cache.js "${CACHE_STAGE}/"
          mkdir -p "${CACHE_STAGE}/assets/podcast-artwork"
          cp assets/podcast-artwork/* "${CACHE_STAGE}/assets/podcast-artwork/"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          committed=false
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp "${CACHE_STAGE}/media-cache.json" "${CACHE_STAGE}/media-cache.js" .
            mkdir -p assets/podcast-artwork
            cp "${CACHE_STAGE}/assets/podcast-artwork/"* assets/podcast-artwork/

            CACHE_LABEL="Replayed generated" npm run validate:cache
            git add media-cache.json media-cache.js assets/podcast-artwork

            if git diff --cached --quiet; then
              echo "Generated media cache is unchanged; no cache commit is needed."
              committed=true
              break
            fi

            GENERATED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git commit \
              -m "Refresh generated media cache (run ${GITHUB_RUN_NUMBER})" \
              -m "Generated from main@${SOURCE_SHA}." \
              -m "Generated at ${GENERATED_AT} UTC."

            if git push origin HEAD:main; then
              committed=true
              break
            fi

            echo "origin/main advanced while refreshing; replaying only the validated cache files (attempt ${attempt}/3)."
          done

          if [[ "${committed}" != "true" ]]; then
            echo "::error::Could not fast-forward the validated cache commit to main after three attempts."
            exit 1
          fi

      - name: Prepare GitHub Pages artifact
        if: steps.refresh_gate.outputs.should_run == 'true'
        run: |
          BUILD_ID="${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}-$(date +%s)"
          mkdir -p _site
          tar \
            --exclude='./_site' \
            --exclude='./.git' \
            --exclude='./.github' \
            --exclude='./node_modules' \
            --exclude='./.env' \
            -cf - . | tar -xf - -C _site
          python3 <<PY
          from pathlib import Path
          build_id = "${BUILD_ID}"
          for relative in ["index.html", "prototype-data.js"]:
              path = Path("_site") / relative
              if not path.exists():
                  continue
              text = path.read_text()
              import re
              text = re.sub(r"styles\.css\?v=[^\"']+", f"styles.css?v={build_id}", text)
              text = re.sub(r"media-cache\.js\?v=[^\"']+", f"media-cache.js?v={build_id}", text)
              text = re.sub(r"prototype-data\.js\?v=[^\"']+", f"prototype-data.js?v={build_id}", text)
              text = re.sub(r"script\.js\?v=[^\"']+", f"script.js?v={build_id}", text)
              text = re.sub(r"media-cache\.json\?v=[^\"']+", f"media-cache.json?v={build_id}", text)
              path.write_text(text)
          print(f"Prepared Pages artifact with cache-busting build id: {build_id}")
          PY

      - name: Configure GitHub Pages
        if: steps.refresh_gate.outputs.should_run == 'true'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: steps.refresh_gate.outputs.should_run == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: needs.build.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
